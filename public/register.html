<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your author account on Blog_nest.">
  <title>Create Account — Blog_nest</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Site Header & Sticky Navbar -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon">☕</div>
        <span>Blog_nest</span>
      </a>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-secondary btn-sm">Sign In</a>
        <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle theme">🌙</button>
      </div>
    </div>
  </header>

  <!-- Register Form Wrapper -->
  <main class="container auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon-badge">✨</div>
        <h1 class="auth-title">Join Blog_nest</h1>
        <p class="auth-subtitle">Create an account to start publishing your thoughts and articles.</p>
      </div>

      <div id="auth-alert"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-with-icon">
            <span class="input-icon">👤</span>
            <input 
              type="text" 
              id="username" 
              class="form-input" 
              placeholder="e.g. john_author" 
              required 
              minlength="3" 
              maxlength="50"
              autocomplete="username"
            >
          </div>
          <div class="form-hint">3–50 characters, letters, numbers, and underscores.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-with-icon">
            <span class="input-icon">✉️</span>
            <input 
              type="email" 
              id="email" 
              class="form-input" 
              placeholder="e.g. john@example.com" 
              required 
              autocomplete="email"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-with-icon">
            <span class="input-icon">🔒</span>
            <input 
              type="password" 
              id="password" 
              class="form-input" 
              placeholder="Minimum 6 characters" 
              required 
              minlength="6"
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle-btn" data-target="password" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <div class="input-with-icon">
            <span class="input-icon">🔒</span>
            <input 
              type="password" 
              id="confirm_password" 
              class="form-input" 
              placeholder="Re-enter your password" 
              required 
              minlength="6"
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle-btn" data-target="confirm_password" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <button type="submit" id="register-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          <span>Create Account</span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
</body>
</html>
