<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Read article on Blog_nest.">
  <title>Article — Blog_nest</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Marked.js for Markdown Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- Reading Progress Indicator -->
  <div id="reading-progress" class="reading-progress-bar"></div>

  <!-- Site Header & Sticky Navbar -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon">☕</div>
        <span>Blog_nest</span>
      </a>

      <div class="nav-actions" id="nav-actions">
        <!-- Dynamically rendered by auth.js -->
        <a href="login.html" class="nav-link">Sign In</a>
        <a href="register.html" class="btn btn-primary btn-sm">Get Started</a>
        <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle theme">🌙</button>
      </div>
    </div>
  </header>

  <!-- Article Main Container -->
  <main class="container container-narrow" style="padding-top: 1rem; padding-bottom: 4rem;">
    <article id="article-wrapper">
      <!-- Loading Skeleton Placeholder -->
      <div style="padding: 3rem 0;">
        <div class="skeleton" style="height: 30px; width: 120px; margin-bottom: 1.5rem;"></div>
        <div class="skeleton" style="height: 48px; width: 90%; margin-bottom: 1rem;"></div>
        <div class="skeleton" style="height: 24px; width: 60%; margin-bottom: 2rem;"></div>
        <div class="skeleton" style="height: 260px; width: 100%; margin-bottom: 1.5rem;"></div>
        <div class="skeleton" style="height: 180px; width: 100%;"></div>
      </div>
    </article>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <div>
          <div class="logo-brand" style="font-size: 1.25rem;">
            <div class="logo-icon" style="width: 32px; height: 32px; font-size: 0.95rem;">☕</div>
            <span>Blog_nest</span>
          </div>
          <p class="footer-brand-desc">
            A cozy, modern haven for thoughts, ideas, and software architecture.
          </p>
        </div>

        <div>
          <ul style="list-style: none; display: flex; gap: 1.5rem;">
            <li><a href="index.html">← Feed</a></li>
            <li><a href="editor.html">Write Article</a></li>
          </ul>
        </div>
      </div>

      <div class="footer-bottom">
        <p>&copy; 2026 Blog_nest Platform.</p>
      </div>
    </div>
  </footer>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
